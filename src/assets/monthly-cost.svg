<svg width="360" height="182" viewBox="0 0 360 182" role="img" aria-labelledby="cost-title">
  <title id="cost-title">Monthly hosting cost for seven products in March 2026, from Ledgerline at 41 dollars down to Halyard at 2 dollars. The rule beside each name is set in its category colour.</title>
  <line x1="160" y1="8" x2="160" y2="174" stroke-width="1" style="stroke:var(--border)"/>
  <text x="0" y="20" font-size="14" fill="currentColor">Ledgerline</text>
  <text x="98" y="20" font-size="12" style="font-family:var(--font-mono);fill:var(--muted)">data</text>
  <rect x="160" y="14" width="146.0" height="2" style="fill:var(--accent-3)"/>
  <text x="358" y="20" font-size="12" text-anchor="end" style="font-family:var(--font-mono)" fill="currentColor">$41</text>
  <text x="0" y="44" font-size="14" fill="currentColor">Tideline</text>
  <text x="98" y="44" font-size="12" style="font-family:var(--font-mono);fill:var(--muted)">infra</text>
  <rect x="160" y="38" width="67.7" height="2" style="fill:var(--accent-2)"/>
  <text x="358" y="44" font-size="12" text-anchor="end" style="font-family:var(--font-mono)" fill="currentColor">$19</text>
  <text x="0" y="68" font-size="14" fill="currentColor">Cusp</text>
  <text x="98" y="68" font-size="12" style="font-family:var(--font-mono);fill:var(--muted)">tooling</text>
  <rect x="160" y="62" width="42.7" height="2" style="fill:var(--accent-1)"/>
  <text x="358" y="68" font-size="12" text-anchor="end" style="font-family:var(--font-mono)" fill="currentColor">$12</text>
  <text x="0" y="92" font-size="14" fill="currentColor">Pennant</text>
  <text x="98" y="92" font-size="12" style="font-family:var(--font-mono);fill:var(--muted)">tooling</text>
  <rect x="160" y="86" width="24.9" height="2" style="fill:var(--accent-1)"/>
  <text x="358" y="92" font-size="12" text-anchor="end" style="font-family:var(--font-mono)" fill="currentColor">$7</text>
  <text x="0" y="116" font-size="14" fill="currentColor">Quartile</text>
  <text x="98" y="116" font-size="12" style="font-family:var(--font-mono);fill:var(--muted)">data</text>
  <rect x="160" y="110" width="14.2" height="2" style="fill:var(--accent-3)"/>
  <text x="358" y="116" font-size="12" text-anchor="end" style="font-family:var(--font-mono)" fill="currentColor">$4</text>
  <text x="0" y="140" font-size="14" fill="currentColor">Marlin</text>
  <text x="98" y="140" font-size="12" style="font-family:var(--font-mono);fill:var(--muted)">infra</text>
  <rect x="160" y="134" width="10.7" height="2" style="fill:var(--accent-2)"/>
  <text x="358" y="140" font-size="12" text-anchor="end" style="font-family:var(--font-mono)" fill="currentColor">$3</text>
  <text x="0" y="164" font-size="14" fill="currentColor">Halyard</text>
  <text x="98" y="164" font-size="12" style="font-family:var(--font-mono);fill:var(--muted)">tooling</text>
  <rect x="160" y="158" width="7.1" height="2" style="fill:var(--accent-1)"/>
  <text x="358" y="164" font-size="12" text-anchor="end" style="font-family:var(--font-mono)" fill="currentColor">$2</text>
</svg>
